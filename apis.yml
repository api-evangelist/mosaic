aid: mosaic
name: Mosaic
description: >-
  Mosaic is a North American brand experience agency with global reach, and one of the
  pillar agencies of Acosta Group. It works across four service lines — experiential
  marketing, B2B corporate experiences and events, integrated commerce and shopper
  programs, and field sales and marketing — plus third-party labor, assisted selling,
  retail merchandising, sales training, retail execution and surge staffing for retail,
  B2B and CPG environments. With roots in Toronto and Dallas and offices in Jacksonville,
  Mosaic says it has spent more than 35 years building brand experiences designed to drive
  awareness, engagement, conversion and behaviour change. Mosaic publishes no developer
  program, API documentation or machine-readable API contract.
